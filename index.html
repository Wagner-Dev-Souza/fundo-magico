<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Semana do Zero ao Programador Contratado - Fundo Mágico</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet" />

		<link rel="stylesheet" href="./src/css/reset.css">
		<link rel="stylesheet" href="./src/css/estilos.css">
		<link rel="stylesheet" href="./src/css/responsivo.css">
	</head>
	<body>
		<header class="header">
			<h1>Fundo Mágico</h1>
			<p class="subtitle">Transforme suas ideias em backgrounds incríveis com o poder da IA. Descreva o que você imagina e veja a magia acontecer.</p>
		</header>
		<main class="container">
			<section class="card main-card">
				<h2 class="card-header">Descreva o background que você deseja</h2>
				<form class="form-group">
					<label class="form-label" for="description">Descreva o background</label>
					<textarea id="description" placeholder="Ex: um gradiente que vai do azul claro para o azul escuro." rows="5" aria-describedby="status-message"></textarea>
					<button id="generate-btn" class="btn-magic" type="submit">
						<span id="btn-text">Gerar Background Mágico</span>
					</button>
					<p id="status-message" class="status" role="status" aria-live="polite"></p>
				</form>
			</section>

			<section id="preview-section" class="preview-card"></section>

			<section id="code-output" class="code-grid">
				<div class="card code-card">
					<div class="code-header">
						<h3 class="code-title">Código HTML</h3>
						<button id="copy-html" class="btn-copy" type="button">Copiar</button>
					</div>
					<pre id="html-code" class="code-block"></pre>
				</div>
				<div class="card code-card">
					<div class="code-header">
						<h3 class="code-title">Código CSS</h3>
						<button id="copy-css" class="btn-copy" type="button">Copiar</button>
					</div>
					<pre id="css-code" class="code-block"></pre>
				</div>
			</section>
		</main>

		<script src="./src/js/index.js"></script>
	</body>
</html>
